[project]
name = "localghost"
version = "0.0.3"
description = "Scan local projects for security issues and measure performance."
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "aiosqlite>=0.21.0",
    "cryptography>=50.0.2",
    "fastapi>=0.143.3",
    "tree-sitter>=0.25",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-typescript>=0.23",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.64.0"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "playwright>=1.64.0",
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
