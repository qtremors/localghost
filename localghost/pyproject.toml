[project]
name = "localghost"
version = "0.1.2"
description = "Inspect web apps and capture web pages in a local-first workspace."
readme = {text = "Inspect web apps and capture web pages in a local-first workspace. See the repository documentation for setup and usage.", content-type = "text/plain"}
authors = [{name = "Tremors"}]
license = "LicenseRef-Tremors-Source-2.0"
license-files = []
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "aiosqlite>=0.22.1",
    "beautifulsoup4>=4.15.0",
    "cryptography>=50.0.2",
    "fastapi>=0.161.1",
    "certifi>=2026.10.19",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.1",
    "soupsieve>=3.0.4",
    "starlette>=1.9.0",
    "tree-sitter>=0.25",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-typescript>=0.23",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.64.1"]

[project.urls]
Documentation = "https://github.com/qtremors/localghost#readme"
License = "https://github.com/qtremors/localghost/blob/main/LICENSE.md"

[project.scripts]
localghost = "backend.entrypoint:main"
xcrape = "backend.modules.xcrape.__main__:legacy_main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "frontend*"]

[tool.setuptools.package-data]
frontend = ["index.html", "static/*", "static/js/*", "static/fonts/*", "static/xcrape/*"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "playwright>=1.64.1",
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
